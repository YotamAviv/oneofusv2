# The video, as sections. This file is the copy.
#
# Everything a person would want to change -- what is said, when it is said, what
# gets pointed at -- lives here. The scripts under tools/intro_video/ record the
# app; this says what the recording means. Change a word here, re-run the
# annotation, and the video says something different without reshooting anything.
#
#   python3 tools/intro_video/sections.py --list          what exists, and its state
#   python3 tools/intro_video/sections.py --cues nerdster writes cues/nerdster.json
#
# FOUR THINGS CAN BE ON SCREEN, and each has a key below.
#
#   prompter  the running commentary along the bottom, scrolling as the take goes
#   beats     the video STOPS -- pause bars, everything dimmed but one spotlit
#             thing, and a bubble pointing at it
#   cards     the video STOPS and a screen of text takes over. Same act as a
#             beat, different still. `lines:` renders the first large and the
#             rest smaller; `words:` makes them arrive one at a time and stay.
#             A section whose card IS the section (no take) has exactly one, and
#             `sections.py --card <id>` renders it.
#   zooms     a punch-in, for the moments made of small text
#   flash     a buzzword, bright, then gone.  NOT BUILT YET.
#
# All of them say WHEN the same way, so a card can land anywhere in a section --
# `t: 0` is its start, a late mark is its end, and any mark is anywhere between.
#
# WHEN is a mark the take recorded, not a number of seconds: `at: tap_publish`.
# Reshooting moves every number and none of the names. `after:` offsets from the
# mark; a plain `t:` still works where nothing suitable is named. The marks a
# take records are in its out/<stamp>.marks.json.
#
# The coordinates in a beat -- anchor, spotlight -- are pixels on a particular
# take, and are the one thing here that isn't human-friendly. Set them once by
# looking at a frame; remeasure if the app's layout moves.

# ---------------------------------------------------------------------------
# WHICH SECTIONS MAKE WHICH VIDEO
#
# Sections are not tagged short/long, because "short" and "long" aren't
# properties of a section -- the same section can be in a two-minute intro and in
# a fifteen-minute talk shot on a big screen for viewing portrait on a TV. So a
# video is a list of sections in order, and a section can be in more than one.
videos:
  intro:
    # Our Own Open Decentralized Identity Network
    sections: [preamble, vouch, invite, nerdster, another_one, crypto, hablotengo,
               people_not_accounts, same_page, liberated, decentralized, opt_in]

  # A place to grow into. Sections that are too long or too subtle for the intro
  # go here rather than being dropped -- see crypto's `defer:` block.
  long:
    # (unnamed, 10-15 minutes)
    sections: []

# ---------------------------------------------------------------------------
sections:

  # -------------------------------------------------------------------------
  - id: preamble
    # Getting the app
    build: build_preamble.sh    # its own shape: three takes and a card, joined
    status: built
    # Three short takes and a card, joined. People can navigate to a web page and
    # install an app without being shown how, so this does not type an address or
    # film the Play Store -- the tap on the Play badge is DRAWN AND NEVER
    # DISPATCHED (overlay_taps.js draws from the marks, not from the touch), so
    # the store never opens and the card says what would have happened.
    cards:
      - hold: 2.0
        lines:
          - Use the app store links
          - to install ONE-OF-US.NET
    actions:
      - Chrome, already on one-of-us.net, with both store badges in view.
      - A finger lands on the Google Play badge. Nothing opens.
      - The card.
      - The home screen, and a finger on the app icon.

  # -------------------------------------------------------------------------
  - id: vouch
    # Our. Own. Decentralized. Identity. Network.
    build: shoot_vouch.js
    status: built
    # Where the section starts. Every take opens with a sync flash and a launch;
    # this is the first mark worth seeing, and the words card is spliced here.
    trim: welcome
    # The one shot nothing can generate: a real phone, a real card, a real scan.
    # Composited BEFORE annotation -- see sections.py build().
    composite:
      footage: footage/vouch_scan_2026-08-31.mp4
      window: scanWindow
      hold: 0.7
      fade: 0.15
    prompter:
      - {t: 0.3, text: "A phone with no keys on it."}
      - {at: tap_create_key, text: "One tap and it has an identity."}
      - {at: scanner, text: "Scan somebody you know."}
    cards:
      # Each word appears and stays, building the sentence. At `welcome` rather
      # than t:0 because the scene is trimmed to that mark -- a card before it
      # sits in the head that gets cut off.
      - at: welcome
        hold: 2.0
        words: [Our Own., Decentralized., Identity Network.]
      # The punchline of the section, and a full screen rather than narration.
      - at: published
        after: 2.5
        hold: 3.5
        lines:
          - That's it.
          - That's all we need to do to build our own,
          - decentralized, identity network.
    todo:
      # Deferred, 2026-09-01. The composite scan covers the mechanics; this would
      # add the human moment -- two people, in a room, one act.
      - A shot from a third phone of the demo phone scanning the phone with my
        identity. Demo phone screen not legible, so it can cut to the emulator.

  # -------------------------------------------------------------------------
  - id: invite
    # You have to be trusted, too
    build: shoot_invite.js
    status: built
    # A cold start spends eight seconds reloading what the identity published;
    # the scene begins once that has settled.
    trim: main_screen
    # NOT A LIMITATION -- a thing people have to do. Two points, and the second
    # is the one that makes the network possible at all:
    #
    #   1. The demo user isn't trusted yet and should send out an invitation.
    #      Nobody is going to scan his phone.
    #   2. The network can be built without being in person.
    #
    # And the caution behind it: people shouldn't only accept invitations and
    # vouch. They should send them out too.
    prompter:
      - {at: main_screen, text: "Nobody has vouched for me yet."}
      - {at: tap_share, text: "If we can't meet, I send a link. It carries my public key."}
      - {at: link, after: 3.4, text: "Send them. Don't just accept them."}
    beats:
      - at: link
        after: 1.2
        hold: 3.4
        text: "A URL with my public key in it.\nVouch for me from anywhere."
        anchor: [544, 1267]
        spotlight: [40, 1010, 1000, 460]
        y: 500
    actions:
      # Done, in shoot_invite.js. The take stops at the share sheet: the link is
      # the point and it is on screen there in full, and this identity's
      # invitation should not actually go anywhere.
      - Share a link containing this identity's public key (the app's Share
        button, then "Share Invitation Link").
      - Show the link. Do NOT actually email or text it.

  # -------------------------------------------------------------------------
  - id: nerdster
    # Enter the Nerdster!
    build: shoot_nerdster.sh
    status: built
    # A gong, like Enter the Dragon. NO ASSET -- deferred 2026-09-01.
    prompter:
      - {t: 0.3, text: "My feed. I'm signed in with a delegate key."}
      - {at: tap_type_menu, text: "Filter it down to books."}
      - {at: tap_sort_menu, text: "Order them by how much people are saying."}
      - {at: swipe_snooze, after: -0.8, text: "Swipe right to snooze one. Not now, maybe later."}
      - {at: swipe_dismiss, after: -0.7, text: "Swipe left and it's gone for good."}
      - {at: tap_react, text: "React to a third one: a like, and something to say."}
      - {at: tap_publish, text: "Publish. That's a signed statement, not a row in\nsomebody's database."}
    beats:
      - at: published
        after: 0.2
        hold: 2.8
        text: "My like and my comment,\nsigned a second ago."
        anchor: [409, 1266]
        spotlight: [60, 1215, 960, 195]
        y: 640
      - at: published
        after: 0.3
        hold: 2.8
        text: "Tom read it too, and said so.\nHis key signed that."
        anchor: [250, 1457]
        spotlight: [60, 1410, 960, 195]
        y: 760
    defer:
      # Good material, too much for the intro.
      - PoV switch. The demo was wider than a phone; try sweeping side to side
        between the two views, then Lisa, Bart and Milhouse under permissive and
        standard.
      - follow/block in a Nerdster context
      - block an identity (reprehensible)

  # -------------------------------------------------------------------------
  - id: another_one
    # Do we really need another one of these?
    build: card
    status: to_build
    # Order is deliberate: show the network working FIRST, then -- once it looks
    # like every other cookie-cutter forum app -- say how it differs.
    cards:
      - hold: 3.5
        lines:
          - "Do we really need another one of these?"
          - "No. But this is different."
          - "A proof of concept of the paradigm, leveraging our own open,
             decentralized identity network."
          - "Open: any service can leverage it, and contribute to it."

  # -------------------------------------------------------------------------
  - id: crypto
    # How? Turn on the crypto
    build: shoot_crypto.sh
    # BLOCKED, 1 Sep 2026. This take needs 32 seconds and screenrecord stops
    # producing at about 26.5 under its load -- a ceiling, not a flush: three
    # different stop timings and five extra seconds of content all gave the same
    # length, while an idle device records 35 seconds faithfully.
    #
    # The fix is the split that was planned anyway: the Intro stops at Hillel's
    # NodeDetails and the delegate keys, and the verification becomes its own
    # section in a later "How it works" video. Two shorter takes, both under the
    # ceiling.
    status: blocked
    # The Nerdster is specifically designed to highlight how this works.
    prompter:
      - {t: 0.4, text: "Somebody I've never met liked this."}
      - {at: tap_moniker, text: "Their name is a link. Follow it into the network."}
      - {at: tap_node, text: "Here they are. My vouch reaches them in a few hops."}
      - {at: tap_delegate_key, text: "This is the key their Nerdster statements are signed with."}
      - {at: tap_published_statements, text: "The statements themselves are just published on the web."}
      - {at: tap_pretty_print, text: "Pretty-print it. Every one is signed, and each names the one before."}
      - {at: zoomed, text: "Take their like."}
      - {at: tap_just_verify, text: "Paste it into the Nerdster's verifier."}
      - {at: tap_verify, text: "Verified. Their key, their signature, their words."}
      - {at: verified, text: "A chain of signatures, all the way back to me\nvouching for somebody I know."}
    zooms:
      - {at: delegate_key_shown, in: 0.5, hold: 1.6, out: 0.5, to: [540, 1180, 620]}
      - {at: statement_selected, in: 0.6, hold: 5.5, out: 0.6, to: [430, 900, 760]}
    beats:
      - at: delegate_key_shown
        after: 2.1
        hold: 2.6
        text: "Their delegate key.\nNot an account — a key."
        anchor: [540, 1150]
        spotlight: [180, 900, 720, 500]
        y: 380
      - at: verified
        after: 0.3
        hold: 3.2
        text: "Signature verified,\nagainst the key we just looked at."
        anchor: [540, 380]
        spotlight: [110, 280, 860, 260]
        y: 700
    announce:
      # Said, not shown. Cards, or narration over the tail of the take.
      - "This is how all three apps work. They are not connected."
      - "Ground a service to a trusted point of view -- like your own."
      - "Collect published, signed content from anywhere. The statements are
         signed and portable."
      - "Verify the signatures."
      - "Aggregate and present."
      - "Evolution enabled, like the Web: services compete using data that is
         signed, trusted and available, not siloed in a monopoly."
    defer:
      # Maybe too long and too hard to follow for the intro; a candidate for the
      # longer video, where there is room to do it slowly.
      - Copy a statement, validate it, then modify it -- change a comment -- and
        watch it fail.
    todo:
      - More text from the other assets (the Internet isn't Google's...).

  # -------------------------------------------------------------------------
  - id: hablotengo
    # HabloTengo, let's talk
    build: todo
    status: to_build
    # Never driven by script, but it is the same kind of web app as the Nerdster,
    # so the same approach should work.
    actions:
      - Navigate to Hillel's NodeDetails.
      - Expand Hillel's delegate keys.
      - Note that he has a hablotengo.com delegate key.
      - Follow the "Handy Dandy" link to his privately published contact info.
      - See "Access Denied".
    announce:
      - "Private information sharing, grounded by our own open decentralized
         network."

  # -------------------------------------------------------------------------
  - id: people_not_accounts
    # People, not accounts
    build: card
    status: to_build
    cards:
      - hold: 3.5
        lines:
          - "I don't have a Nerdster account or a ONE-OF-US.NET account."
          - "I gave the Nerdster a delegate key I claimed as mine. The Nerdster has
             an account with me."
          - "Other people vouched for my identity. If anything, I have an account
             with them."
          - "Our network already exists. This effort is just so we can use it
             online."
          - "Whether you drive Uber, comment on news, like movies or products --
             you're human, a person, ONE OF US."

  # -------------------------------------------------------------------------
  - id: same_page
    # Let's get on the same page
    build: card
    status: to_build
    cards:
      - hold: 3.5
        lines:
          - "We build the identity network and **let** them use it."
          - "We can't let them build it. One silo will never agree to relying on
             another's identities."

  # -------------------------------------------------------------------------
  - id: liberated
    # The Internet liberated lies and pornography
    build: card
    status: to_build
    cards:
      - hold: 3.5
        lines:
          - "The Internet liberated lies and pornography, and we got confused,
             depressed, divided, and angry."
          - "Crypto on the Internet can liberate authenticity and trust. Maybe
             sanity, truth, and decency."

  # -------------------------------------------------------------------------
  - id: decentralized
    # Decentralized
    build: card
    status: to_build
    cards:
      - hold: 3.5
        lines:
          - "Must be, if it's yours and you don't own your own silo."
    flash: Democracy 2.0

  # -------------------------------------------------------------------------
  - id: opt_in
    # Opt-in
    build: card
    status: to_build
    cards:
      - hold: 3.5
        lines:
          - "Just because you can use your authentic voice doesn't mean you have
             to."
    flash: First Amendment 2.0

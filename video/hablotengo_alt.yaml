# An ALTERNATE take on the HabloTengo section. This file is the copy.
#
# Its own file, not a section in intro.yaml, and deliberately so. Section ids
# have to be unique across all of video/*.yaml, and the order of `sections:` in
# a file IS its running order -- so an alternate parked in intro.yaml would
# become part of the intro, playing right after the section it is an
# alternative to. Here it is buildable and assemblable on its own and the intro
# does not know it exists.
#
#   python3 tools/video/sections.py --cues hablotengo_delegate
#   python3 tools/video/sections.py --build hablotengo_delegate
#   python3 tools/video/sections.py --assemble hablotengo_alt
#
# THE SCHEMA IS IN video/README.md.

title: HabloTengo, with a delegate key

sections:
  # -------------------------------------------------------------------------
  - id: hablotengo_delegate
    title: "HabloTengo!\nThe key that lets you write"
    preconditions:
      - An identity on the phone (restore_demo_identity.sh), and that identity
        vouched-for well enough that Tom's point of view reaches Hillel.
      - >-
        ZERO hablotengo.com delegates for the demo identity, in BOTH places -- no
        key in the app's secure storage, and no delegate statement in production.
        The take films a first-time sign-in, and either one left over changes what
        it films rather than failing. A leftover KEY skips the "Create Delegate
        Key?" dialog entirely; a leftover STATEMENT turns it into "Existing
        Delegate Found / ROTATE KEY", which the take does not drive. See the
        teardown below -- both halves, every time.
      - Hillel still has a hablotengo.com delegate key. The Nerdster draws the
        HabloTengo link only on a node that has one, and without it this take
        has nowhere to go.
      - HabloTengo reachable at hablotengo.com. The take clears its sign-in
        state itself, so it does not matter whether it was signed in before.
    side_effects:
      - PUBLISHES, unlike the section it is an alternate to, which only reads.
      - >-
        Leaves EXACTLY ONE hablotengo.com delegate, in both places -- the key in
        the app's secure storage, and one delegate statement in production.
      - Saves a contact card for the demo identity with a phone number on it,
        marked strict. Also real, also stays.
    teardown:
      # BOTH HALVES. Deleting one leaves the app repairing the other -- clearing
      # just the key brings back "Existing Delegate Found" on the next take, and
      # clearing just the statement brings back the "Unregistered Delegate Key"
      # screen. Neither is a failure, and both film the wrong thing.
      - >-
        The key -- reinstall the app and re-run restore_demo_identity.sh, or
        delete it from the identity app's Advanced screen.
      - >-
        The statement -- truncate the identity's stream back to the last statement
        worth keeping. It is a hash chain, so a delegate cannot be removed from
        the middle; this works because the take's statement is the newest one.
        List them with the export API (spec=<identityToken>, includeId=true), then
        run tools/video/truncate_statements.js with --token <identityToken>
        --keep <id of the last keeper> --prod, and I_MEAN_IT=yes in the
        environment. It refuses to touch production without that, and refuses any
        token that is not the demo identity's.
    build: shoot_hablotengo_delegate.js
    status: to_build
    # NOT SHOT YET. Written from the HabloTengo source rather than from a device
    # -- see the header of shoot_hablotengo_delegate.js, which says which files
    # each selector came out of and what it expects to need a pass on.
    #
    # WHAT THIS ONE SAYS THAT THE OTHER DOES NOT. The sibling section signs in
    # with the identity alone and ends on Access Denied: a second, unrelated
    # service recognises the identity and refuses it anyway, which is the
    # privacy half of the point. This one takes the delegate key, is refused
    # just the same -- the refusal never depended on the key -- and then carries
    # on to the thing the key is actually for: writing. The identity gets you
    # recognised. The delegate key gets you a voice.
    trim: feed
    # The take ends on the saved card. Without `until:` it would run on into
    # whatever the sheet did next.
    until: done
    prompter:
      - {at: hablotengo_link_shown, after: -0.6, text: "Hillel has a HabloTengo key. Follow it."}
      - {at: signin_open, text: "Sign in -- and this time, take a delegate key."}
      - {at: identity_app, after: 0.4, text: "The identity app asks. \"Yes, create delegate.\""}
      - {at: denied, after: 0.4, text: "Still refused. The key gives me a voice, not an audience."}
      - {at: editing, text: "My own card, though, I can write."}
      - {at: strict_set, after: -0.4, text: "Per field, not per account: this number is strict."}
    beats:
      # Boxes measured BY THE TAKE, not typed in here. The shoot script records
      # each one from the semantics tree in device pixels (see boxOf), so these
      # survive a reshoot -- which raw `anchor`/`spotlight` pixels do not.
      - at: delegate_arrived
        after: 1.0
        hold: 4.5
        text: "Both keys arrived.\n- Identity: who I am, vouched for by people\n- Delegate: this service's key, and only this service's"
        box: delegateColumnBox
        pad: 22
        y: 1250
      - at: denied
        after: 1.2
        hold: 4.0
        text: "Recognised, and refused.\nHillel's rules decide, not the service's."
        box: deniedBox
        pad: 20
        y: 1100
      # The Edit button is the whole argument in one widget: my_contact_screen.dart
      # draws it only `if (signInState.hasDelegate)`, so on the other take it is
      # not on the screen at all.
      - at: my_card
        after: 1.4
        hold: 4.0
        text: "This button only exists because I took the key.\nNo key, no writing."
        box: editButtonBox
        pad: 18
        y: 900
      - at: strict_set
        after: 0.8
        hold: 4.5
        text: "Permissive, standard, strict --\nset on THIS field, not on an account."
        box: visibilityBarBox
        pad: 18
        y: 1150
    cards:
      - at: saved
        after: 1.2
        hold: 3.5
        lines:
          - Signed with a key I own,
          - on a service that never sees my identity key.
    flashes:
      - at: saved
        after: 0.3
        hold: 0.9
        word: "Mine"
        tail: "A key per service. Revoke one and the rest are untouched."
        tail_hold: 3.2
    todo:
      - Shoot it. Every selector past the sign-in is read from source, not from
        a device; expect the entry row and the unlabelled visibility segments to
        need a pass.
      - Decide whether this replaces the intro's hablotengo section or stays a
        separate cut. It is longer, and it makes a second point.

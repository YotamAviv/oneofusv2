# The intro video, as sections. This file is the copy.
#
# Everything a person would want to change -- what is said, when it is said,
# what gets pointed at -- lives here. The scripts under tools/video/
# record the app; this says what the recording means. Change a word here,
# re-run the annotation, and the video says something different without
# reshooting anything.
#
# THE SCHEMA IS IN video/README.md. Read it once; it explains prompter, beats,
# cards, zooms, how a cue says WHEN, and why beat coordinates are the one
# unfriendly thing in these files.
#
#   python3 tools/video/sections.py --list          what exists, and its state
#   python3 tools/video/sections.py --cues <id>     writes cues/<id>.json
#
# ONE FILE PER VIDEO, and the order of `sections:` IS the running order. Section
# ids have to be unique across all of video/*.yaml, because the cue files they
# generate share one directory; sections.py refuses duplicates.

title: Our Own Open Decentralized Identity Network

sections:
  # -------------------------------------------------------------------------
  - id: preamble
    title: "Our. Own. Decentralized. Identity. Network."
    preconditions:
      - Chrome and the identity app installed; the app icon on the home screen.
    side_effects:
      - None. The Play badge tap is drawn, never dispatched.
    build: build_preamble.sh    # its own shape: three takes and a card, joined
    status: built
    # Three short takes and a card, joined. People can navigate to a web page and
    # install an app without being shown how, so this does not type an address or
    # film the Play Store -- the tap on the Play badge is DRAWN AND NEVER
    # DISPATCHED (overlay_taps.js draws from the marks, not from the touch), so
    # the store never opens and the card says what would have happened.
    cards:
      - hold: 2.0
        lines:
          - Use the app store links
          - to install ONE-OF-US.NET
    actions:
      - Chrome, already on one-of-us.net, with both store badges in view.
      - A finger lands on the Google Play badge. Nothing opens.
      - The card.
      - The home screen, and a finger on the app icon.

  # -------------------------------------------------------------------------
  - id: vouch
    title: "Get started\nVouch for someone's identity and humanity"
    preconditions:
      - Nothing. It wipes the app and builds an identity from scratch, and the
        one deep link it uses (keymeid://vouch) is the ordinary one a real
        person follows from an invitation -- not a filming-only link.
    side_effects:
      - WIPES THE APP: destroys whatever identity is on the phone.
      - Publishes a vouch for Tom from a brand-new identity, which is then
        orphaned in production.
      - Every take after this one needs ./restore_demo_identity.sh first, and
        THAT needs a filmTools build (it gets the identity in over
        keymeid://importkey). The `restore_demo_identity` flag below makes the
        build do it, so the state this section SAVES is the identity the next
        one needs rather than the throwaway it just filmed.
    build: shoot_vouch.js
    status: built
    # The take ends holding a BRAND-NEW random identity -- that is the whole
    # point of it, a phone with no keys on it. Which makes it the wrong thing to
    # hand to the next section: saved as-is, every later take inherits the
    # throwaway, publishes against it, and the demo identity's streams sit empty
    # while everything looks like it worked.
    restore_demo_identity: true
    # Where the section starts. Every take opens with a sync flash and a launch;
    # this is the first mark worth seeing, and the words card is spliced here.
    trim: welcome
    # The one shot nothing can generate: a real phone, a real card, a real scan.
    # Composited BEFORE annotation -- see sections.py build().
    composite:
      footage: footage/vouch_scan_2026-08-31.mp4
      window: scanWindow
      hold: 0.7
      fade: 0.15
    # THE CLOSING CARD IS THE END OF THE SECTION. The take now watches for the
    # "Trusted: Success" snackbar by its colour and marks `published` when it
    # appears and `success_cleared` when it goes -- so the section runs to the
    # end of the act it describes, rather than stopping mid-spinner as it did
    # while that wait was a blind sleep. Without `until:` the take then carried
    # on past its own last word: three seconds of the scanner coming back, over
    # a composite that had already ended.
    until: success_cleared
    until_after: 0.6
    prompter:
      - {t: 0.3, text: "A phone with no keys on it."}
      - {at: scanner, text: "Scan somebody's identity card."}
      # At the moment the statement is actually signed and published -- a mark
      # read out of the footage by find_snackbar.js, not guessed at.
      #
      # The app says so itself, in a "Trusted: Success" snackbar, and you cannot
      # see it: the bar sits at y2060-2220 and the prompter band covers y1920 on
      # down. A beat cannot rescue it (the band is drawn over spliced stills too)
      # and neither can a zoom (it clamps to the frame edge, so the bar stays at
      # the bottom). Showing it would mean raising BAND_H for every section. So
      # the band says it instead, at exactly the right instant.
      # - {at: published, text: "Signed on the phone. Published to the network."}
    beats:
      # The snackbar itself, measured by the take (find_snackbar.js reports the
      # rectangle as well as the moment). This could not be shown at all while
      # the prompter was a fixed band across the bottom -- it sits at y2060-2220,
      # under it. Now that a caption comes and goes, it can be pointed at.
      - at: published
        after: 0.5
        hold: 4.0
        # A line starting "- " is a bullet; see lib/bubble.js. The lead line stays
        # centred, the bullets line up with each other.
        text: "The private crypto key on this phone signed and published\n- a public key (identity)\n- where to find its statements (endpoint)\n- that it belongs to a human called \"Tom\""
        box: snackbarBox
        pad: 20
        y: 1400
    cards:
      # The punchline of the section, and a full screen rather than narration.
      - at: success_cleared
        after: 0.6
        hold: 3.5
        lines:
          - That's it.
          - That's all we need to do to build our own,
          - decentralized, identity network.
    flashes:
      - at: published
        after: 0.4
        hold: 0.9
        word: "Decentralized"
    todo:
      # Deferred, 2026-09-01. The composite scan covers the mechanics; this would
      # add the human moment -- two people, in a room, one act.
      - A shot from a third phone of the demo phone scanning the phone with my
        identity. Demo phone screen not legible, so it can cut to the emulator.

  # -------------------------------------------------------------------------
  - id: invite
    title: "You others to vouch for your identity"
    preconditions:
      - An identity on the phone (restore_demo_identity.sh after vouch).
    side_effects:
      - None. It stops at the share sheet; the invitation is never sent.
    build: shoot_invite.js
    status: built
    # A cold start spends eight seconds reloading what the identity published;
    # the scene begins once that has settled.
    trim: main_screen
    # NOT A LIMITATION -- a thing people have to do. Two points, and the second
    # is the one that makes the network possible at all:
    #
    #   1. The demo user isn't trusted yet and should send out an invitation.
    #      Nobody is going to scan his phone.
    #   2. The network can be built without being in person.
    #
    # And the caution behind it: people shouldn't only accept invitations and
    # vouch. They should send them out too.
    prompter:
      # - {at: main_screen, text: "Nobody has vouched for me yet."}
      - {at: tap_share, text: "Share invitations electronically to vouch remotely."}
      # - {at: link, after: 3.4, text: "Send them. Don't just accept them."}
    beats:
      # "Me" is the name on the card because nothing better exists yet: a moniker
      # comes from somebody else's vouch, and nobody has vouched.
      - at: main_screen
        after: 0.8
        hold: 3.4
        text: "No one has vouched for me,\nI'm unknown, just 'Me', for now.."
        box: meBox
        pad: 24
        y: 1500
      - at: link
        after: 1.2
        hold: 3.4
        text: "This invitation link carries my public key."
        anchor: [544, 1267]
        spotlight: [40, 1010, 1000, 460]
        y: 500
    cards:
      # Closes the section and hands over to the next one. `done` is the take's
      # last mark, and `until: done` ends the section on the card rather than on
      # whatever the recorder caught afterwards -- end_seconds counts the card's
      # own hold, so the cut lands on its last frame.
      - at: done
        hold: 2.0
        lines:
          - How can we use this identity network?
    until: done
    actions:
      # Done, in shoot_invite.js. The take stops at the share sheet: the link is
      # the point and it is on screen there in full, and this identity's
      # invitation should not actually go anywhere.
      - Share a link containing this identity's public key (the app's Share
        button, then "Share Invitation Link").
      - Show the link. Do NOT actually email or text it.

  # -------------------------------------------------------------------------
  - id: signin
    title: "Enter the Nerdster"
    preconditions:
      - An identity on the phone that somebody has vouched for.
      - The Nerdster deployed at nerdster.org.
      - A filmTools build of the identity app. The reset uses
        keymeid://deletekey to get back to "vouched, no delegate yet", which is
        the only state that shows the "Create Delegate Key?" prompt.
    side_effects:
      - Deletes the delegate key from the phone and the browser, then mints
        a NEW one and publishes its delegate statement.
      - Leaves the browser SIGNED IN -- which is what nerdster, crypto_teaser
        and hablotengo all need.
    build: shoot_signin.sh
    status: to_build
    # THE SECTION THAT WAS MISSING. shoot_signin.js has existed and worked since
    # 2026-08-28 -- capture_manual §1 calls it the take that "removed every
    # fiction at once" -- but when the copy moved into a storyboard it was never
    # given a section, so it built for nobody. The intro jumped from the
    # invitation straight to a feed that was already signed in, with nothing on
    # screen to say how.
    #
    # It is one continuous take on one device, against production: the Nerdster's
    # home page in a browser, into the web app, out to the identity app to
    # authorise a delegate key, and back signed in.
    #
    # The point is what does NOT happen. No account, no password, no email, no
    # "sign in with Google". A service asks who you are, your identity app makes
    # it a key of its own, and the identity key never leaves the phone.
    trim: home
    prompter:
      - {at: home, text: "The Nerdster, a proof of concept of this decentralized identity paradigm, not connected to ONE-OF-US.NET."}
      # - {at: tap_launch, text: "Open the web app."}
      # - {at: app_ready, text: "It needs to know who I am.\nI have no account here, and I am not making one."}
      # - {at: tap_signin, text: "Sign in with ONE-OF-US.NET instead."}
      - {at: tap_yes, text: "Create and give the Nerdster a crypto key that will represent us there."}
      # - {at: back_to_browser, text: "That key is a delegate: it speaks for me here,\nand nowhere else."}
      - {at: signed_in, text: "I've signed in. I've identified myself using my public identity and handed over a delegate key to represent me on this service."}
      # - {at: dismiss, text: "No password. No email. Nothing to be breached."}

  # -------------------------------------------------------------------------
  - id: nerdster
    title: "Common Nerdster Usage.."
    preconditions:
      - Signed in to the Nerdster with a delegate key (signin).
    side_effects:
      - Deletes what earlier takes published to nerdster.org, then publishes
        a reaction and a comment.
    build: shoot_nerdster.sh
    status: built
    # overlay_taps cuts the head to the sync flash, and that is where this
    # section starts; there is nothing further to trim to.
    trim: none
    # A gong, like Enter the Dragon. NO ASSET -- deferred 2026-09-01.
    prompter:
      - {t: 0.3, text: "My feed. I'm signed in with a delegate key."}
      - {at: tap_type_menu, text: "Filter to books."}
      - {at: tap_sort_menu, text: "Order by number of reactions."}
      - {at: swipe_snooze, after: -0.8, text: "Swipe right = Snooze, hide until new activity."}
      - {at: swipe_dismiss, after: -0.7, text: "Swipe left = Dismiss, don't show again."}
      - {at: tap_react, text: "React..."}
      - {at: tap_publish, text: "Signed and published. Portable content along with proof that it's mine."}
    beats:
      - at: published
        after: 0.2
        hold: 2.8
        text: "My new like and comment."
        anchor: [409, 1266]
        spotlight: [60, 1215, 960, 195]
        y: 640
      - at: published
        after: 0.3
        hold: 2.8
        text: "Tom reacted, too.\nI know him, vouched for his identity directly."
        anchor: [250, 1457]
        spotlight: [60, 1410, 960, 195]
        y: 760
    cards:
      # Was its own section, another_one. It is the same act as a beat -- the
      # video stops and a screen of text takes over -- and it belongs to the
      # feed it is arguing about, so it closes this section instead of standing
      # alone. Order is deliberate: show the network working FIRST, then say how
      # it differs from every other forum app.
      # after: 0.3, and it cannot be much more. The take sleeps 2.2s past
      # `published` but the screen is static by then, so screenrecord emits
      # almost no frames and the FILE ends about 0.4s after the mark however
      # long the script waits. A splice point past the last frame is an error.
      #
      # It reads fine: the two beats above are at +0.2 and +0.3 and splices play
      # in time order, so this lands after both -- beat, beat, card, and the
      # section ends. The card covers the screen anyway, so what is under it at
      # the splice point does not matter.
      - at: published
        after: 0.3
        hold: 3.5
        lines: # TODO: Not centered, maybe <pre>?
          - "Do we really need another one of these?"
          - "No."
          - "But this is different."
          - "A proof of concept of the paradigm, leveraging our own open,
             decentralized identity network."
          - "Open: any service can leverage it, and contribute to it."
    # The card is the last thing in the section.
    until: published
    until_after: 0.3
    defer:
      # Good material, too much for the intro.
      - PoV switch. The demo was wider than a phone; try sweeping side to side
        between the two views, then Lisa, Bart and Milhouse under permissive and
        standard.
      - follow/block in a Nerdster context
      - block an identity (reprehensible)

  # -------------------------------------------------------------------------
  - id: crypto_teaser
    title: "How Cryptography\nmakes this possible"
    preconditions:
      - Signed in to the Nerdster with a delegate key (signin).
    side_effects:
      - Deletes what earlier takes published to nerdster.org -- a card already
        reacted to has no React button to press.
      - Publishes a rating.
      - LEAVES Show Crypto AND Show FYI ON.
    build: shoot_crypto_teaser.js
    status: to_build
    # Updated crypto teaser
    # Turn on both Show Crypto and Show FYI.
    # Generate another like.
    # Highlight something in the area of "To Be signed and published.."
    # Click Okay on the FYI dialog
    # Wait a few seconds on the Published dialog and have some narration
    # Click on the interpret toggle and wait a second
    # Scroll down inside the FYI dialog so that the final red "signature" line comes into view
    # Highlight something in the area of "signature:" and have some narration
    # Wait a few seconds and dismiss (Okay) the FYI dialog.
    #
    # Have some narration that all 3 apps publish signed statements using the keys you let them use.
    # 
    # Click the refresh icon on the nerdster. This briefly (too briefly) shows the 
    # loading statements progress bar above the top toolbar. 
    # Try and pause on that in the video, highlight it, and explain that this is these services
    # (or any other) can read and verify our authentic content.
    #
    # Where the section starts: on the feed, a beat before the menu opens. The
    # launch and the sync flash before it are staging, not content.
    trim: feed
    prompter:
      - {at: feed, after: 0.4,
         text: "A quick look.. How the crypto is used."}
      - {at: crypto_on, text: "Expose the signed statements: reactions, vouches, follows, blocks, etc... Look for the shield icon"}
      - {at: fyi_on,
         text: "Show each statement as it's being drafted, signed, and published."}
      - {at: fyi_shown,
         text: "What's about to be signed and published.."}
      - {at: published_shown,
         text: "Interpreted view is slightly more readable (keys to names)."}
      - {at: raw_shown, text: "Raw, un-interpreted view is machine verifiable."}
      - {at: signature_shown,
         text: "Cryptographically signed using your Nerdster delegate key."}
      # Out on the open network, in a plain browser tab. Draft copy.
      - {at: statements_tab,
         text: "Fetched straight from the open network. Any service can, and they'll know who said what."}
      - {at: pretty_printed,
         text: "Pretty-print..."}
      - {at: zoomed, after: 0.8,
         text: "Signed by my delegate key.\nYou (or anyone) can verify (See menu item); Trust cryptography, not the Nerdster."}
      - {at: dismissed,
         text: "All three apps work this way: signed statements,\nsigned, published using keys you trust."}
      - {at: loading,
         text: "Fetching signed content --\nthe only source of all content shown."}
    beats:
      # HIGHLIGHTS. The video stops, everything dims but the spotlit rectangle,
      # and a bubble points at it -- the treatment the invite section uses.
      #
      # MEASURED, not guessed. The take writes fyiText, jsonBox and refreshBox
      # into its marks file in CSS viewport units; these are those boxes through
      # the take's own viewportToDevice (scale 2.755, offY 216), because beats
      # are in device pixels. Re-measure if the sheet's layout moves.
      - at: fyi_shown
        after: 1.6
        hold: 2.0
        text: "FYI, just to highlight how this paradigm works."
        anchor: [540, 1224]
        spotlight: [44, 1150, 992, 150]
        y: 820
      # The statement's address on the open network. Measured by the take.
      - at: export_link_shown
        after: 0.8
        hold: 3.0
        text: "The statement's address on the open network.\nLet's go and look at it."
        box: exportLinkBox
        pad: 22
        # Well clear of the link -- the bubble sat on top of the very thing it
        # was pointing at.
        y: 700
      - at: signature_shown
        after: 1.2
        hold: 2.0
        text: "Key and signature makes the statement portable,\nUsable by any service."
        # MEASURED, not typed. The take finds the red `signature` line in its own
        # footage (find_red.js) and records the box; this names it. A rectangle
        # written by hand missed, because a line inside a scrolling view lands
        # wherever the scroll got to, which differs every take.
        #
        # find_red --value, so the box takes in the SIGNATURE as well as the word.
        # Only the key is red; without it this highlighted the label and left the
        # signature outside the spotlight.
        box: signatureBox
        pad: 30
        y: 1060
      # The loading bar is on screen for a moment and gone. Stopping on it is the
      # only way anyone reads it, which is what a beat is for.
      - at: loading
        after: 0.5
        hold: 3.0
        text: "Fetching statements, verifying signatures .."
        anchor: [540, 300]
        spotlight: [0, 250, 1080, 90]
        y: 560
    until: loading
    until_after: 1.0
    todo:
      # The card's second line names a video that does not exist. Before this
      # ships, either that video does or the line changes.
      - Measure the three beats against a real frame -- see the note above them.
      - Confirm the "upcoming video" promise is one we are keeping.

  # -------------------------------------------------------------------------
  - id: hablotengo
    title: "HabloTengo!\nLet's talk"
    preconditions:
      - Signed in to the Nerdster with a delegate key (signin).
      - An identity with a hablotengo.com delegate key in the feed (Hillel);
        without one the Nerdster does not draw the HabloTengo link at all.
    side_effects:
      - Clears hablotengo.com sign-in state before recording, so the take can
        reach Access Denied.
      - Signs the identity in to HabloTengo -- identity only, no delegate key.
    build: shoot_hablotengo.js
    status: to_build
    # The point is that a SECOND, unrelated service rides on the same identity
    # network -- and that grounding it there is what lets it keep things private
    # as well as authentic. It ends on being refused, which is the feature.
    #
    # The HabloTengo link only appears on a node that HAS a hablotengo.com
    # delegate key, which is why the section goes to Hillel. It does NOT open his
    # key list to prove that -- the link itself is the proof, and it is in the
    # header. node_details.dart opens hablotengo.com/app?target=<identity> in a
    # new tab.
    #
    # NOT YET SHOT. Written from Yotam's outline, 2 Sep 2026. The HabloTengo half
    # -- signing in with the identity app but no delegate key, and the Access
    # Denied that follows -- has never been driven by a script, so expect its
    # selectors to need a pass on the device.
    trim: feed
    prompter:
      - {at: pov_set,
         text: "See content from someone else's Point of View (PoV). Notice that names and content change"}
      - {at: tap_context_family, after: 1.4,
         text: "Use Tom's family Context."}
      - {at: filtered,
         text: "Narrow content down by tags (and related tags)."}
      - {at: node_details,
         text: "Let's call Hillel."}
      - {at: hablotengo_open,
         text: "Same identities, our identities, on another, unconnected service."}
    beats:
      # Both boxes are MEASURED by the take and named here, rather than typed --
      # see the note on crypto_teaser's signature beat for why.
      - at: hablotengo_link_shown
        after: 0.8
        hold: 2.6
        text: "Handy dandy shortcut to HabloTengo, a contact sharing service."
        box: habloButtonBox
        pad: 26
        y: 1500
      - at: denied
        after: 1.0
        hold: 3.2
        text: "Access Denied.\nHabloTengo leverages our open, decentralized network to keep things private, not just authentic."
        box: deniedBox
        pad: 30
        y: 1200
    todo:
      - The reset must leave HabloTengo SIGNED OUT, or the second run of this
        take shows a signed-in app and never reaches Access Denied.

  # -------------------------------------------------------------------------
  - id: close_account
    title: "Close account?"
    preconditions:
      - An identity on the phone with a vouch for Tom outstanding (the PEOPLE tab
        shows it) and a nerdster.org delegate key outstanding (SERVICES shows it).
      - Signed in on the Nerdster in Chrome on the device, so the delegate key
        being cleared has something to stop working in.
      - Ratings in the feed signed by THAT delegate key, or there is nothing to
        watch disappear. Shoot signin then nerdster first, in that order.
      - A filmTools build of the identity app, for app_state.sh. Its restore
        rides on keymeid://exportkey and keymeid://importkey.
    side_effects:
      - Publishes one `clear` statement, and that is all it changes on the
        network. UNDOABLE, because the streams are append-only hash chains --
        snapshot_statements.js records the head before the take and
        truncate_statements.js --keep rewinds to it afterwards. Proven.
      - Deletes the delegate's private key from the phone, which is a separate
        act from clearing and is permanent. Also undoable -- `app_state.sh save`
        before and `restore` after, over the app's filming-only exportkey and
        importkey deep links. Verified to bring back the SAME key, token and
        all; a different delegate would orphan every rating the old one signed.
      - Restore the phone first and the network last. Skipping the phone half
        leaves the delegation standing and the ratings visible, but nothing able
        to sign in as that delegate. Readable, not writable.
    build: shoot_close_account.js
    status: to_build
    # The opening card IS the start of the section, so the take is trimmed to it.
    # A card anchored before the trim mark sits in the head that gets cut off.
    trim: opening
    # THE POINT OF THE SECTION. Every other service ends with "delete my account",
    # and there is no account here to delete -- so the question has no answer, and
    # that IS the answer. What can be undone is undone from the phone, by the
    # identity key, without asking anyone's permission.
    cards:
      # Opens on the question, before any app is on screen.
      - at: opening
        hold: 2.6
        lines:
          - "Close account?"
          - "There is no account."
    prompter:
      - {at: people,
         text: "I can clear or edit my outstanding vouches here."}
      - {at: people_read,
         text: "I don't have a ONE-OF-US.NET account. No one does."}
      - {at: people_read_2,
         text: "If anything, folks have an account with those who've vouched for them."}
      - {at: services,
         text: "I can clear or revoke my outstanding delegate keys here."}
      - {at: nerdster_refreshed,
         text: "I didn't close my Nerdster account. I used my identity key to clear\nthe delegate statement associating that key with me."}
      # AFTER the tap, not before it: the line lands on the keys being there,
      # which is what it is about.
      - {at: tap_export, after: 1.2,
         text: "My keys are mine, not theirs."}
      - {at: advanced,
         text: "Advanced: recover from lost or compromised keys, manage blocks."}
    beats:
      # BEFORE: the key is known and associated, which is why my own ratings are
      # on screen at all. Measured by the take, like the pair below it.
      - at: my_rating
        after: 0.4
        hold: 3.0
        text: "My delegate key, known and associated with my identity.\nThat is why my own ratings are here."
        box: keyOkBox
        pad: 26
        y: 1300
      # The click itself. It is the moment the section turns on, and without a
      # highlight it reads as the feed changing by itself.
      - at: before_refresh
        after: 0.3
        hold: 2.4
        text: "Refresh"
        box: refreshBox
        pad: 22
        y: 1300
      # The key at the top right of the Nerdster stops being usable the moment
      # the delegate statement is cleared. MEASURED by the take -- the header
      # moves with the window, and a rectangle typed for one take misses on the
      # next. See crypto_teaser's signature beat.
      - at: nerdster_refreshed
        after: 1.4
        hold: 3.2
        text: "The delegate key I signed in with no longer represents me."
        box: keyIssueBox
        pad: 26

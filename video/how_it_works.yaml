# The how-it-works video, as sections. This file is the copy.
#
# Everything a person would want to change -- what is said, when it is said,
# what gets pointed at -- lives here. The scripts under tools/video/
# record the app; this says what the recording means. Change a word here,
# re-run the annotation, and the video says something different without
# reshooting anything.
#
# THE SCHEMA IS IN video/README.md. Read it once; it explains prompter, beats,
# cards, zooms, how a cue says WHEN, and why beat coordinates are the one
# unfriendly thing in these files.
#
#   python3 tools/video/sections.py --list          what exists, and its state
#   python3 tools/video/sections.py --cues <id>     writes cues/<id>.json
#
# ONE FILE PER VIDEO, and the order of `sections:` IS the running order. Section
# ids have to be unique across all of video/*.yaml, because the cue files they
# generate share one directory; sections.py refuses duplicates.

title: How it works

sections:
  # -------------------------------------------------------------------------
  - id: crypto_chain
    # The signature chain, walked: vouch -> identity key ->
    # delegate key -> the delegation that ties them together.
    build: shoot_crypto.sh
    # The recording used to stop short, and the reason is now known. 1 Sep 2026.
    #
    # Every take of this section stopped producing frames at 26.5-27.2s for two
    # days. The takes whose FILES ran 33-37s were not counter-examples: they hold
    # the same ~26.5s of real frames and then one frozen frame to the end, which
    # pads the container duration and hides it. Count frames, not seconds.
    #
    # It was device memory pressure. Sixty-odd Chrome tabs were open on the
    # emulator; restarting it cleared the ceiling, and this section now records
    # 60.7s. Restart the AVD before a long take. See doc/video/capture_manual.md
    # §10, which also warns that a failed take leaves screenrecord running and
    # those accumulate -- /data was 89% full.
    #
    # What broke the section was separate, and worse because it was quiet: a
    # mistimed mark. `verified` was set by a blind sleep(2500) after the Verify
    # tap, but the verdict lands about 0.09s after it, so the mark sat 2.4s later
    # than the thing it names, and the closing line and beat anchored on it
    # resolved past the end of the footage. annotate.js said nothing, because a
    # prompter line past the end simply never drew. Both fixed: the mark comes
    # from the waitFor that detects the verdict, and annotate.js refuses any cue
    # later than the take.
    status: built
    # REWRITTEN 1 Sep 2026. The old sequence went out to Chrome
    # and the verifier; this one stays in the app and walks the delegation, with
    # about four seconds on each line so it can actually be read. The take that
    # matches it is shoot_crypto.js, which has the full brief at the top.
    #
    # NO BEATS OR ZOOMS YET. Both are pixel coordinates -- anchor, spotlight,
    # `to` -- measured off a frame of a particular take. There is a take to
    # measure against now (out/crypto_20260901-220039*), so this is the next
    # thing to do here rather than a blocked one.
    #
    # The Nerdster is specifically designed to highlight how this works.
    prompter:
      - {t: 0.4, text: "Somebody I've never met liked this."}
      - {at: crypto_on, text: "Show Crypto. Now the Nerdster shows its work."}
      - {at: tap_moniker, text: "Their name is a link into the network."}
      - {at: node_details, text: "Here they are. My vouch reaches them in a few hops."}
      - {at: identity_key_shown, text: "This is their identity key."}
      - {at: identity_raw_shown, text: "Raw, it is just a public key -- the thing itself."}
      - {at: identity_interpreted_shown,
         text: "The Nerdster interprets keys it knows,\nso they read as names."}
      - {at: delegate_key_shown,
         text: "And this is the delegate key their\nNerdster statements are signed with."}
      - {at: delegation_shown, text: "The shield holds the delegation itself."}
      - {at: delegation_raw_shown,
         text: "Signed by their identity key --\nthe one Tom vouched for."}
      - {at: delegation_interpreted_shown,
         text: "They delegated this key to nerdster.org from their\nidentity app. The chain is unbroken."}
    announce:
      # Said, not shown. Cards, or narration over the tail of the take.
      - "This is how all three apps work. They are not connected."
      - "Ground a service to a trusted point of view -- like your own."
      - "Collect published, signed content from anywhere. The statements are
         signed and portable."
      - "Verify the signatures."
      - "Aggregate and present."
      - "Evolution enabled, like the Web: services compete using data that is
         signed, trusted and available, not siloed in a monopoly."
    defer:
      # This IS the longer video now, so these are candidates for the section
      # rather than exiles from the intro.
      - Copy a statement, validate it, then modify it -- change a comment -- and
        watch it fail.
    todo:
      - More text from the other assets (the Internet isn't Google's...).
